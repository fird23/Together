<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Together</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #F7F5EC; color: #2B2A35; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #151722; color: #ECEAF5; } }
    .logo { position: relative; width: 96px; height: 64px; margin: 0 auto 24px; }
    .logo i { position: absolute; top: 0; width: 64px; height: 64px; border-radius: 50%; }
    .logo i:first-child { left: 0; background: #96A0D3; }
    .logo i:last-child { right: 0; background: #4A52A3; opacity: .92; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 auto 20px; max-width: 320px; line-height: 1.5; opacity: .8; }
    button { height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: #4A52A3; color: #fff; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true"><i></i><i></i></div>
    <h1>Together</h1>
    <p id="msg">Приложению нужен интернет, чтобы открыть ваше пространство. Проверьте соединение и попробуйте снова.</p>
    <button type="button" onclick="location.reload()">Повторить</button>
  </main>
</body>
</html>
